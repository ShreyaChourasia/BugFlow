[project]
name = "bugflow-backend"
version = "0.1.0"
description = "BugFlow FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "rq>=1.16",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "structlog>=24.1",
    "pgvector>=0.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "mlflow>=2.14",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
markers = [
    "story: marks a test as verifying a user story, e.g. story(\"US-01\")",
]
addopts = "--cov=app --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's dependency injection idiom is `param: T = Depends(...)`, which B008
# exists to warn against for other, mutable-default reasons; it doesn't apply here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001"]

[tool.mypy]
# 3.12 here only so mypy can parse numpy's own stub files (they use PEP 695
# syntax); our code still targets 3.11 per requires-python/Docker.
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
