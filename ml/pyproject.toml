[project]
name = "bugflow_ml"
version = "0.1.0"
description = "BugFlow ML package: mining, labeling, features, models, assignment, explain, monitoring, registry"
requires-python = ">=3.11"
dependencies = [
    "pydriller>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bugflow_ml*"]

[tool.pytest.ini_options]
markers = [
    "story: marks a test as verifying a user story, e.g. story(\"US-04\")",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
