name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action now gates scanning private repos behind a
      # paid license; the underlying OSS gitleaks binary is still free
      # regardless of repo visibility, so run it directly instead.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --log-opts="--all" -v

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bugflow
          POSTGRES_PASSWORD: bugflow
          POSTGRES_DB: bugflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bugflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bugflow:bugflow@localhost:5432/bugflow
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libgomp (LightGBM's OpenMP runtime)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - name: Install ml package
        run: pip install -e ./ml
      - name: Install backend
        run: pip install -e "./backend[dev]"
      - name: Enable pgvector extension
        run: psql "postgresql://bugflow:bugflow@localhost:5432/bugflow" -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Lint (ruff)
        run: cd backend && ruff check .
      - name: Type check (mypy)
        run: cd backend && mypy app
      - name: Apply migrations
        run: cd backend && alembic upgrade head
      - name: Test with coverage
        run: cd backend && pytest --cov-report=xml

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libgomp (LightGBM's OpenMP runtime)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - name: Install ml package
        run: pip install -e "./ml[dev]"
      - name: Lint (ruff)
        run: cd ml && ruff check .
      - name: Type check (mypy)
        run: cd ml && mypy bugflow_ml
      - name: Test
        run: cd ml && pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npx tsc --noEmit
      - run: npm test
